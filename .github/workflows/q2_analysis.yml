name: Q2 KMeans Analysis

on:
  push:
    branches: [main]
    paths:
      - 'project_materials/Area1_Load.csv'
      - 'project_materials/Area2_Load.csv'
      - 'project_materials/Area1_Weather.csv'
      - 'project_materials/Area2_Weather.csv'
      - 'project_materials/analysis/q2/q2_kmeans_analysis.py'
      - '.github/workflows/q2_analysis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn matplotlib

      - name: Run Question 2 analysis
        run: python project_materials/analysis/q2/q2_kmeans_analysis.py

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project_materials/analysis/q2
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate Question 2 clustering outputs"
            git push
          fi
