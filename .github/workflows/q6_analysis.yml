name: Q6 Comprehensive Regularity Analysis

on:
  push:
    paths:
      - 'project_materials/analysis/q6/q6_regularity_evaluation.py'
      - '.github/workflows/q6_analysis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy matplotlib
      - name: Run Question 6 analysis
        run: python project_materials/analysis/q6/q6_regularity_evaluation.py
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project_materials/analysis/q6
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Generate Question 6 comprehensive outputs"
            git push
          fi
