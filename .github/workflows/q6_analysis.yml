name: Q6 Comprehensive Regularity Analysis

on:
  push:
    paths:
      - 'project_materials/analysis/q6/q6_regularity_evaluation.py'
      - '.github/workflows/q6_analysis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy matplotlib
      - name: Normalize Q2 area labels for Q6 runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('project_materials/analysis/q2/Q2_silhouette_scores.csv')
          lines = p.read_text(encoding='utf-8').splitlines()
          out = [lines[0]]
          for line in lines[1:]:
              if line.startswith('1,'):
                  line = 'Area1,' + line[2:]
              elif line.startswith('2,'):
                  line = 'Area2,' + line[2:]
              out.append(line)
          p.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
      - name: Run Question 6 analysis
        run: python project_materials/analysis/q6/q6_regularity_evaluation.py
      - name: Commit generated outputs
        run: |
          git checkout -- project_materials/analysis/q2/Q2_silhouette_scores.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project_materials/analysis/q6
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Generate Question 6 comprehensive outputs"
            git push
          fi
