name: Q3 Weather Regression Analysis

on:
  push:
    branches: [main]
    paths:
      - 'project_materials/Area1_Load.csv'
      - 'project_materials/Area2_Load.csv'
      - 'project_materials/Area1_Weather.csv'
      - 'project_materials/Area2_Weather.csv'
      - 'project_materials/analysis/q3/q3_weather_regression.py'
      - '.github/workflows/q3_analysis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy pandas matplotlib scikit-learn

      - name: Run Question 3 analysis
        run: python project_materials/analysis/q3/q3_weather_regression.py

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project_materials/analysis/q3/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate Question 3 regression outputs"
            git push
          fi
