name: Q5 Weather Forecast Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - 'project_materials/analysis/q5/q5_weather_forecast.py'
      - 'project_materials/Area1_Load.csv'
      - 'project_materials/Area2_Load.csv'
      - 'project_materials/Area1_Weather.csv'
      - 'project_materials/Area2_Weather.csv'
      - '.github/workflows/q5_analysis.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib scikit-learn

      - name: Run Question 5 analysis
        run: python project_materials/analysis/q5/q5_weather_forecast.py

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project_materials/analysis/q5
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Generate Question 5 weather forecast outputs"
            git push
          fi
